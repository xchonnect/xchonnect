[package]
name = "xchonnect-uniffi"
description = "Xchonnect core bindings for native wallets (Swift and Kotlin via UniFFI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "xchonnect_uniffi"
# staticlib: iOS XCFramework; cdylib: Android .so and host tests of the generated code.
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
# Project-local bindings generator, always matching the uniffi crate version:
#   scripts/uniffi-bindgen.sh generate --library <lib> --language swift --out-dir <dir>
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Builds the uniffi-bindgen CLI (scripts/build-swift.sh, scripts/build-kotlin.sh).
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]
# Exports a dApp-side helper (`TestDapp`, fixed public origin key) for the Swift/Kotlin
# round-trip tests. Never enable in wallet release builds.
test-helpers = []
# Wallet-side signing safety (simulation, policy, permissions, CHIP-0002 handlers).
wallet-kit = ["dep:xchonnect-wallet-kit", "dep:chia-bls", "dep:chia-protocol", "dep:hex", "dep:serde_json"]
default = ["wallet-kit"]

[dependencies]
xchonnect-core = { workspace = true, features = ["idna"] }
uniffi = { version = "0.32", default-features = false }
xchonnect-wallet-kit = { workspace = true, optional = true }
chia-bls = { version = "0.36", optional = true }
chia-protocol = { version = "0.36", optional = true }
hex = { version = "0.4", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
chia-sdk-test = "0.36"
chia-sdk-driver = "0.36"
chia-sdk-types = "0.36"
chia-puzzle-types = "0.36"

# FFI glue generated by binding tools needs unsafe code; all protocol logic lives in
# xchonnect-core, which forbids it.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

# Same as the workspace clippy lints (a crate cannot inherit them while overriding
# `unsafe_code`).
[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
