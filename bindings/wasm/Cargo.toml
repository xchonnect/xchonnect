[package]
name = "xchonnect-wasm"
description = "Xchonnect core compiled to WebAssembly for browsers and Node (used by @xchonnect/dapp)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
keywords = ["chia", "wallet", "wasm", "webassembly", "chip-0002"]
categories = ["wasm", "cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xchonnect-core = { workspace = true, features = ["ohttp"] }
# Must match the wasm-bindgen CLI version used by scripts/build-wasm.sh.
wasm-bindgen = "=0.2.129"
serde_json = "1"
# G2 point addition for signature aggregation (pure Rust, wasm32-friendly).
bls12_381 = { version = "0.9", default-features = false, features = ["groups", "alloc"] }
hex = "0.4"

# FFI glue generated by wasm-bindgen needs unsafe code; all protocol logic lives in
# xchonnect-core, which forbids it.
[dev-dependencies]
chia-bls = "0.36"

[lints.rust]
unsafe_code = "allow"
