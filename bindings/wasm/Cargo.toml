[package]
name = "xchonnect-wasm"
description = "Xchonnect core bindings (wasm)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

# FFI glue generated by binding tools needs unsafe code; all protocol logic lives in
# xchonnect-core, which forbids it.
[lints.rust]
unsafe_code = "allow"
