[package]
name = "xchonnect-wasm"
description = "Xchonnect core compiled to WebAssembly for browsers and Node (used by @xchonnect/dapp)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xchonnect-core.workspace = true
# Must match the wasm-bindgen CLI version used by scripts/build-wasm.sh.
wasm-bindgen = "=0.2.129"
serde_json = "1"

# FFI glue generated by wasm-bindgen needs unsafe code; all protocol logic lives in
# xchonnect-core, which forbids it.
[lints.rust]
unsafe_code = "allow"
