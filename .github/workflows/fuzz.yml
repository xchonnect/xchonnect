name: Continuous fuzzing and coverage

# The `fuzz` job in ci.yml runs every target for 30 s on each push: enough to catch a
# regression, far too short to find anything deep. This workflow is the sustained run -
# ten minutes per target each night, on a corpus that survives between runs - plus the
# coverage report that shows what the tests and the fuzzer never reach (docs/fuzzing.md).
on:
  schedule:
    # Nightly, after the supply-chain scan.
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per fuzz target"
        default: "10"
      targets:
        description: "Space-separated subset of targets (empty = all)"
        default: ""

permissions:
  contents: read

concurrency:
  # Never two fuzz runs at once: they would fight over the corpus cache.
  group: fuzz
  cancel-in-progress: false

jobs:
  targets:
    name: Enumerate fuzz targets
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          # From the manifest, so a new [[bin]] is fuzzed without touching this file.
          all=$(grep -A2 '^\[\[bin\]\]' fuzz/Cargo.toml | sed -n 's/^name = "\(.*\)"/\1/p')
          if [ -n "${REQUESTED:-}" ]; then
            for t in $REQUESTED; do
              echo "$all" | grep -Fxq "$t" || { echo "unknown fuzz target: $t" >&2; exit 1; }
            done
            all=$(echo "$REQUESTED" | tr ' ' '\n' | grep -v '^$')
          fi
          echo "$all"
          echo "list=$(echo "$all" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.list) }}
    permissions:
      contents: read
    env:
      # Nightly may add lints the pinned toolchain does not know; lints are enforced by
      # the rust job in ci.yml.
      RUSTFLAGS: ""
      MINUTES: ${{ inputs.minutes || '10' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # The grown corpus is the whole point of continuous fuzzing: each night starts
      # where the last one stopped. The committed fuzz/corpus/<target>/seed-* files stay
      # read-only and are passed as a second, additional corpus directory.
      - name: Restore the corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: corpus-live/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Build
        run: cargo +nightly fuzz build ${{ matrix.target }}
      - name: Fuzz for ${{ env.MINUTES }} minutes
        id: run
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "corpus-live/${{ matrix.target }}"
          cargo +nightly fuzz run "${{ matrix.target }}" \
            "corpus-live/${{ matrix.target }}" "fuzz/corpus/${{ matrix.target }}" \
            -- -max_total_time=$((MINUTES * 60)) -print_final_stats=1
      - name: Minimise the corpus
        # Keeps the cache from growing without bound while preserving coverage.
        if: always()
        continue-on-error: true
        run: cargo +nightly fuzz cmin "${{ matrix.target }}" "corpus-live/${{ matrix.target }}"
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: corpus-live/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash artifacts
        if: steps.run.outcome == 'failure'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: File a private advisory and fail
        if: steps.run.outcome == 'failure'
        env:
          # A crashing parser input may be exploitable, so it goes into a draft security
          # advisory (maintainers only), never a public issue. The default GITHUB_TOKEN
          # cannot create advisories; see docs/fuzzing.md for the secret to configure.
          GH_TOKEN: ${{ secrets.FUZZ_ADVISORY_TOKEN }}
        run: ./scripts/fuzz-crash-report.sh fuzz/artifacts

  coverage:
    name: Coverage (core, relay, gateway, wallet-kit)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: xchonnect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      XCHONNECT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/xchonnect
      # Coverage instrumentation makes the compiler emit code the lint gate would not
      # see anyway; lints are enforced by the rust job in ci.yml.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Toolchain (from rust-toolchain.toml) + llvm-tools
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - run: ./scripts/coverage.sh
      - name: Summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            cat target/coverage/summary.txt
            echo '```'
            echo '### Crypto and parsing modules'
            echo '```'
            cat target/coverage/crypto-parsing.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: error
          retention-days: 30
