name: Release publish

# Two steps, two decisions (docs/release.md, "Cutting a release"):
#
# - Pushing a signed annotated tag (`git tag -s v1.0.0`) runs everything that publishes
#   nothing: the gate, the reproducible builds, the SBOMs, the crate packaging, the npm
#   tarball, the image builds and the release directory. Nothing is signed, pushed,
#   uploaded or published.
# - Publishing a GitHub release for that tag in the web UI runs the same jobs again and
#   then, once a maintainer approves the `release` environment, publishes: images to
#   ghcr.io, the signed assets onto that release, npm, crates.io.
#
# Every job that pushes, signs or publishes runs in the GitHub environment `release`,
# only on a `refs/tags/v*` ref, only after every build and package job passed, and checks
# the release state and the approval again itself. The registries trust only OIDC tokens
# of release-publish.yml in that environment, and the environment admits only `v*` tags,
# which only maintainers may create; so a workflow changed on a branch cannot publish.
#
# Every job checks out the commit the gate resolved the tag to, by SHA: a tag moved during
# the run cannot change what is built. This is the only workflow: nothing runs on a push
# to a branch or on a pull request.
#
# Artifacts are not trusted between jobs: any job of the run (a dependency's build script
# in one of them, say) can replace any artifact of the run. Every job that uploads one
# states its SHA-256 digests as a job output, which only that job can set, and every job
# that downloads it checks the download against that output
# (scripts/release-artifact-sums.sh). Image digests travel the same way.
#
# Every binary and the SBOMs are built a second time by a job of their own on a fresh
# runner (`binaries-<arch>-repro`, `sbom-repro`, `npm-pack-repro`), which must arrive at
# the digests the producing job stated; every publishing job waits for all of them.
#
# The file is called release-publish.yml, not release.yml: every tag up to v0.1.0-rc.4
# carries an older release.yml that any writer could start by hand on that tag and that
# would sign under release.yml@refs/tags/<old tag>. That workflow is disabled by its ID
# (docs/release.md, "What the owner configures"), and the registries' trusted publishers
# and the Sigstore identity name this file. Do not rename it back.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  release:
    # `published` also fires for a pre-release; a draft fires nothing.
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed tag to re-run the pipeline for"
        required: true
      publish:
        description: "Publish (images, release assets, npm, crates.io). Needs a published GitHub release for the tag and the run started on the tag itself (Use workflow from: the tag). Off = build and verify only"
        type: boolean
        default: false

permissions:
  contents: read

# One run per tag at a time: the verify run of the tag push finishes before the release
# run of the same tag starts.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Images are named after the repository owner, lower-cased by ghcr convention.
  REGISTRY: ghcr.io

jobs:
  gate:
    name: Gate (tag, versions, changelog, signer)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.id.outputs.tag }}
      version: ${{ steps.id.outputs.version }}
      epoch: ${{ steps.id.outputs.epoch }}
      publish: ${{ steps.id.outputs.publish }}
      commit: ${{ steps.id.outputs.commit }}
      signer: ${{ steps.id.outputs.signer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      - name: Toolchain (from rust-toolchain.toml; the gate reads the crate versions with cargo)
        run: rustup show active-toolchain || rustup toolchain install
      - id: id
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::release gate: $1"; exit 1; }
          # Versions, changelog, a tag on a commit that is on main, signed by a key pinned
          # for a login in .github/release-maintainers.txt as main has it; it reports the
          # tag's commit and the signer.
          gate_out="$RUNNER_TEMP/gate-out"
          : > "$gate_out"
          XCHONNECT_GATE_OUTPUT="$gate_out" ./scripts/release-gate.sh "$TAG"
          commit=$(sed -n 's/^commit=//p' "$gate_out")
          signer=$(sed -n 's/^signer=//p' "$gate_out")
          [ -n "$commit" ] && [ -n "$signer" ] || fail "the gate script reported no commit or signer"
          # Everything later checks out $commit by SHA. It must be what this job checked
          # and, on a run of the tag itself, the commit the event was for.
          [ "$(git rev-parse HEAD)" = "$commit" ] ||
            fail "checked out $(git rev-parse HEAD), but $TAG points at $commit on GitHub"
          if [ "$RUN_REF" = "refs/tags/$TAG" ] && [ "$RUN_SHA" != "$commit" ]; then
            fail "this run was started for $RUN_SHA, but $TAG now points at $commit; a release tag is never moved"
          fi
          # Only a published GitHub release publishes. A tag push verifies; a manual run
          # publishes only when asked to and only under the conditions below.
          case "$EVENT" in
            release) publish=true ;;
            workflow_dispatch) publish=$DISPATCH_PUBLISH ;;
            *) publish=false ;;
          esac
          if [ "$publish" = "true" ]; then
            # The signing identity is release-publish.yml at the run's ref, and the
            # `release` environment admits only tags; anything but this tag cannot publish.
            [ "$RUN_REF" = "refs/tags/$TAG" ] ||
              fail "a publishing run must run on refs/tags/$TAG, not $RUN_REF (manual run: pick the tag under 'Use workflow from')"
            # Published, not a draft, pre-release flag matching the version, tag unmoved.
            # The publishing jobs repeat this: "Re-run failed jobs" does not re-run the gate.
            ./scripts/release-state-check.sh "$TAG" "$commit"
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            # One build timestamp for every artifact of this release: the commit time.
            echo "epoch=$(git -c log.showsignature=false log -1 --pretty=%ct)"
            echo "publish=$publish"
            echo "commit=$commit"
            echo "signer=$signer"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------
  # Build and package. No job here can push, sign or publish anything, and none gets an
  # OIDC token or write access.
  # ---------------------------------------------------------------------------------------

  binaries-x86_64:
    name: Binaries (x86_64-unknown-linux-gnu, built twice)
    needs: [gate]
    runs-on: ubuntu-24.04
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    env:
      XCHONNECT_RELEASE_TARGET: x86_64-unknown-linux-gnu
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$XCHONNECT_RELEASE_TARGET"
      # No build cache: a release binary is compiled from source every time, so a
      # poisoned cache cannot reach a signed artifact.
      - name: Reproducibility gate (two cold builds must agree)
        run: ./scripts/release-repro-check.sh
      - name: Collect the artifacts and state their digests
        id: sums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release-repro/a/xchonnect-relay dist/
          cp target/release-repro/a/xchonnect-gateway dist/
          cp target/release-repro/a/BUILD-INFO.txt dist/
          (cd dist && sha256sum xchonnect-relay xchonnect-gateway | tee SHA256SUMS)
          ./scripts/release-artifact-sums.sh --output sums dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: dist/
          if-no-files-found: error
          retention-days: 7

  binaries-aarch64:
    name: Binaries (aarch64-unknown-linux-gnu, built twice)
    needs: [gate]
    runs-on: ubuntu-24.04-arm
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    env:
      XCHONNECT_RELEASE_TARGET: aarch64-unknown-linux-gnu
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$XCHONNECT_RELEASE_TARGET"
      # No build cache: a release binary is compiled from source every time, so a
      # poisoned cache cannot reach a signed artifact.
      - name: Reproducibility gate (two cold builds must agree)
        run: ./scripts/release-repro-check.sh
      - name: Collect the artifacts and state their digests
        id: sums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release-repro/a/xchonnect-relay dist/
          cp target/release-repro/a/xchonnect-gateway dist/
          cp target/release-repro/a/BUILD-INFO.txt dist/
          (cd dist && sha256sum xchonnect-relay xchonnect-gateway | tee SHA256SUMS)
          ./scripts/release-artifact-sums.sh --output sums dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: binaries-aarch64-unknown-linux-gnu
          path: dist/
          if-no-files-found: error
          retention-days: 7

  binaries-x86_64-repro:
    name: Binaries (x86_64-unknown-linux-gnu, independent rebuild)
    # A third cold build, on a fresh runner, after binaries-x86_64. It uploads nothing and
    # fails unless it lays out the same files with the same digests as that job's output,
    # so a compromised or non-deterministic runner cannot reach a signature alone.
    needs: [gate, binaries-x86_64]
    runs-on: ubuntu-24.04
    env:
      XCHONNECT_RELEASE_TARGET: x86_64-unknown-linux-gnu
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$XCHONNECT_RELEASE_TARGET"
      # The same output path and target directory as release-repro-check.sh uses in
      # binaries-x86_64: BUILD-INFO.txt and OUT_DIR paths depend on them.
      - name: One cold build
        env:
          XCHONNECT_RELEASE_OUT: target/release-repro/a
          XCHONNECT_RELEASE_TARGET_DIR: target/release-build
        run: ./scripts/release-build.sh
      - name: Same files, same digests as binaries-x86_64
        env:
          EXPECTED: ${{ needs.binaries-x86_64.outputs.sums }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release-repro/a/xchonnect-relay dist/
          cp target/release-repro/a/xchonnect-gateway dist/
          cp target/release-repro/a/BUILD-INFO.txt dist/
          (cd dist && sha256sum xchonnect-relay xchonnect-gateway | tee SHA256SUMS)
          if [ -z "$EXPECTED" ] || ! diff -u <(printf '%s\n' "$EXPECTED") <(./scripts/release-artifact-sums.sh dist); then
            echo "::error::binaries-x86_64 stated other digests than this rebuild (above: - that job, + this one); the x86_64-unknown-linux-gnu binaries do not reproduce on another runner"
            exit 1
          fi
          echo "x86_64-unknown-linux-gnu binaries reproduce on a second runner"

  binaries-aarch64-repro:
    name: Binaries (aarch64-unknown-linux-gnu, independent rebuild)
    # A third cold build, on a fresh runner, after binaries-aarch64. It uploads nothing and
    # fails unless it lays out the same files with the same digests as that job's output,
    # so a compromised or non-deterministic runner cannot reach a signature alone.
    needs: [gate, binaries-aarch64]
    runs-on: ubuntu-24.04-arm
    env:
      XCHONNECT_RELEASE_TARGET: aarch64-unknown-linux-gnu
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$XCHONNECT_RELEASE_TARGET"
      # The same output path and target directory as release-repro-check.sh uses in
      # binaries-aarch64: BUILD-INFO.txt and OUT_DIR paths depend on them.
      - name: One cold build
        env:
          XCHONNECT_RELEASE_OUT: target/release-repro/a
          XCHONNECT_RELEASE_TARGET_DIR: target/release-build
        run: ./scripts/release-build.sh
      - name: Same files, same digests as binaries-aarch64
        env:
          EXPECTED: ${{ needs.binaries-aarch64.outputs.sums }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release-repro/a/xchonnect-relay dist/
          cp target/release-repro/a/xchonnect-gateway dist/
          cp target/release-repro/a/BUILD-INFO.txt dist/
          (cd dist && sha256sum xchonnect-relay xchonnect-gateway | tee SHA256SUMS)
          if [ -z "$EXPECTED" ] || ! diff -u <(printf '%s\n' "$EXPECTED") <(./scripts/release-artifact-sums.sh dist); then
            echo "::error::binaries-aarch64 stated other digests than this rebuild (above: - that job, + this one); the aarch64-unknown-linux-gnu binaries do not reproduce on another runner"
            exit 1
          fi
          echo "aarch64-unknown-linux-gnu binaries reproduce on a second runner"

  sbom:
    name: CycloneDX SBOMs
    needs: [gate]
    runs-on: ubuntu-24.04
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-cyclonedx (pinned, must match scripts/sbom.sh)
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: rustup target add wasm32-unknown-unknown
      - run: ./scripts/sbom.sh
      - name: State the digests of the SBOMs
        id: sums
        run: ./scripts/release-artifact-sums.sh --output sums target/sbom
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sbom
          path: target/sbom/
          if-no-files-found: error
          retention-days: 7

  sbom-repro:
    name: CycloneDX SBOMs (independent rebuild)
    # The SBOMs again on a fresh runner; they must have the digests `sbom` stated. They
    # embed the checkout's absolute path, which is the same on every hosted runner.
    needs: [gate, sbom]
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-cyclonedx (pinned, must match scripts/sbom.sh)
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: rustup target add wasm32-unknown-unknown
      - run: ./scripts/sbom.sh
      - name: Same files, same digests as sbom
        env:
          EXPECTED: ${{ needs.sbom.outputs.sums }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED" ] || ! diff -u <(printf '%s\n' "$EXPECTED") <(./scripts/release-artifact-sums.sh target/sbom); then
            echo "::error::sbom stated other digests than this rebuild (above: - that job, + this one); the SBOMs do not reproduce"
            exit 1
          fi
          echo "SBOMs reproduce on a second runner"

  crates-package:
    name: Crates (packaged and built from the tarballs)
    # Publishes nothing. Its build scripts run here, without any token; the `crates` job
    # uploads with --no-verify, builds nothing, and checks that it uploads the tarballs
    # whose digests this job states.
    needs: [gate]
    runs-on: ubuntu-24.04
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # No build cache, as for the binaries.
      - name: cargo package --locked for xchonnect-core and xchonnect-wallet-kit
        run: ./scripts/release-crates.sh
      - name: State the digests of the .crate tarballs
        id: sums
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crates"
          for crate in xchonnect-core xchonnect-wallet-kit; do
            cp "target/package/$crate-$VERSION.crate" "$RUNNER_TEMP/crates/"
          done
          ./scripts/release-artifact-sums.sh --output sums "$RUNNER_TEMP/crates"

  npm-pack:
    name: npm tarball for @xchonnect/dapp (built, not published)
    # Everything that runs code from dependencies (cargo build scripts, wasm-bindgen, tsc)
    # runs here, without an OIDC token. The `npm` job publishes exactly this tarball, and
    # only when `npm-pack-repro` built the same bytes on another runner.
    needs: [gate]
    runs-on: ubuntu-24.04
    outputs:
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # No build cache, as for the binaries: the published WASM core is compiled from source.
      - name: Install wasm-bindgen CLI (pinned in bindings/wasm/Cargo.toml)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build and pack (WASM core with its gzip size budget, SDK, npm pack)
        id: pack
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: ./scripts/release-npm-pack.sh "$RUNNER_TEMP/npm" "$VERSION"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error
          retention-days: 7

  npm-pack-repro:
    name: npm tarball for @xchonnect/dapp (second, independent build)
    # The same build on a fresh runner, after npm-pack. It uploads nothing and fails unless
    # its digest equals npm-pack's, so one compromised or non-deterministic build cannot
    # reach npm alone, and every publishing job (all need this one) waits for the answer.
    needs: [gate, npm-pack]
    runs-on: ubuntu-24.04
    outputs:
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # No build cache, as for the binaries: the published WASM core is compiled from source.
      - name: Install wasm-bindgen CLI (pinned in bindings/wasm/Cargo.toml)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build and pack (WASM core with its gzip size budget, SDK, npm pack)
        id: pack
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: ./scripts/release-npm-pack.sh "$RUNNER_TEMP/npm" "$VERSION"
      - name: Both builds made the same tarball
        env:
          FIRST: ${{ needs.npm-pack.outputs.sha256 }}
          SECOND: ${{ steps.pack.outputs.sha256 }}
        run: |
          if [ -z "$FIRST" ] || [ "$FIRST" != "$SECOND" ]; then
            echo "::error::npm-pack built ${FIRST:-nothing}, this job $SECOND; the npm tarball does not reproduce"
            exit 1
          fi
          echo "npm tarball reproduces: $SECOND"

  images:
    name: Images (relay and gateway, built twice)
    needs: [gate, binaries-x86_64, binaries-aarch64]
    runs-on: ubuntu-24.04
    outputs:
      # Multi-platform image index digests; `images-publish` pushes exactly these.
      relay: ${{ steps.build.outputs.relay }}
      gateway: ${{ steps.build.outputs.gateway }}
      # Per-platform manifest digests inside those indexes.
      relay-amd64: ${{ steps.build.outputs.relay-amd64 }}
      relay-arm64: ${{ steps.build.outputs.relay-arm64 }}
      gateway-amd64: ${{ steps.build.outputs.gateway-amd64 }}
      gateway-arm64: ${{ steps.build.outputs.gateway-arm64 }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: dl/binaries-x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: binaries-aarch64-unknown-linux-gnu
          path: dl/binaries-aarch64-unknown-linux-gnu
      - name: The binaries are the ones the binaries jobs uploaded
        env:
          SUMS_X86_64: ${{ needs.binaries-x86_64.outputs.sums }}
          SUMS_AARCH64: ${{ needs.binaries-aarch64.outputs.sums }}
        run: |
          set -euo pipefail
          EXPECTED=$SUMS_X86_64 ./scripts/release-artifact-sums.sh --check dl/binaries-x86_64-unknown-linux-gnu
          EXPECTED=$SUMS_AARCH64 ./scripts/release-artifact-sums.sh --check dl/binaries-aarch64-unknown-linux-gnu
      # BuildKit runs as a container; pinned by digest like every action (Docker Hub tag
      # moby/buildkit:buildx-stable-1 resolved to v0.33.1 on 2026-10-14).
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build each image twice and compare digests
        id: build
        run: |
          set -euo pipefail
          for COMPONENT in relay gateway; do
            rm -rf ctx
            mkdir -p ctx/amd64 ctx/arm64
            # The image contains exactly the binary the release signs; TARGETARCH in
            # Dockerfile.dist picks the right one per platform.
            cp "dl/binaries-x86_64-unknown-linux-gnu/xchonnect-$COMPONENT" ctx/amd64/
            cp "dl/binaries-aarch64-unknown-linux-gnu/xchonnect-$COMPONENT" ctx/arm64/
            chmod 0755 ctx/*/"xchonnect-$COMPONENT"
            # Fixed mtimes, so layer tars do not carry the download time.
            find ctx -exec touch -d "@$SOURCE_DATE_EPOCH" {} +
            for pass in a b; do
              # The same multi-platform build `images-publish` pushes, into a local OCI
              # layout; its index digest is the digest the registry will have. --no-cache:
              # the second build must not be the first one read back from the cache.
              docker buildx build --no-cache \
                --file deploy/Dockerfile.dist \
                --target "$COMPONENT" \
                --platform linux/amd64,linux/arm64 \
                --provenance=false --sbom=false \
                --metadata-file "meta-$COMPONENT-$pass.json" \
                --output "type=oci,dest=image-$COMPONENT-$pass.tar,rewrite-timestamp=true" \
                ctx
              jq -r '."containerimage.digest"' "meta-$COMPONENT-$pass.json" > "digest-$COMPONENT-$pass"
            done
            if ! diff -u "digest-$COMPONENT-a" "digest-$COMPONENT-b"; then
              echo "::error::the $COMPONENT image is not reproducible"
              exit 1
            fi
            index=$(cat "digest-$COMPONENT-a")
            case "$index" in sha256:????????????????????????????????????????????????????????????????) ;;
              *) echo "::error::no image digest for $COMPONENT: '$index'"; exit 1 ;;
            esac
            echo "$COMPONENT=$index" >> "$GITHUB_OUTPUT"
            # The index blob in the OCI layout lists one manifest per platform.
            tar -xOf "image-$COMPONENT-a.tar" "blobs/sha256/${index#sha256:}" |
              jq -r '.manifests[] | "\(.platform.architecture) \(.digest)"' |
              while read -r arch digest; do
                echo "$COMPONENT $arch $digest"
                echo "$COMPONENT-$arch=$digest" >> "$GITHUB_OUTPUT"
              done
          done

  assemble:
    name: Release directory (assets and SHA256SUMS, unsigned)
    needs: [gate, binaries-x86_64, binaries-aarch64, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: read # the checkout, for scripts/release-artifact-sums.sh
    outputs:
      sums: ${{ steps.assemble.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: dl/binaries-x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: binaries-aarch64-unknown-linux-gnu
          path: dl/binaries-aarch64-unknown-linux-gnu
      - name: The binaries are the ones the binaries jobs uploaded
        env:
          SUMS_X86_64: ${{ needs.binaries-x86_64.outputs.sums }}
          SUMS_AARCH64: ${{ needs.binaries-aarch64.outputs.sums }}
        run: |
          set -euo pipefail
          EXPECTED=$SUMS_X86_64 ./scripts/release-artifact-sums.sh --check dl/binaries-x86_64-unknown-linux-gnu
          EXPECTED=$SUMS_AARCH64 ./scripts/release-artifact-sums.sh --check dl/binaries-aarch64-unknown-linux-gnu
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: sbom
          path: dl/sbom
      - name: The SBOMs are the ones the sbom job uploaded
        env:
          EXPECTED: ${{ needs.sbom.outputs.sums }}
        run: ./scripts/release-artifact-sums.sh --check dl/sbom
      - name: Assemble the release directory
        id: assemble
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          # A fixed list: an artifact added under another name is not picked up.
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            d=dl/binaries-$triple
            for b in xchonnect-relay xchonnect-gateway; do
              cp "$d/$b" "out/$b-$VERSION-$triple"
            done
            cp "$d/BUILD-INFO.txt" "out/BUILD-INFO-$triple.txt"
          done
          cp dl/sbom/*.cdx.json out/
          # One manifest over every asset: this file is what gets signed, so a
          # signature covers the whole release indivisibly.
          (cd out && sha256sum -- * | sort -k2 > SHA256SUMS)
          cat out/SHA256SUMS
          echo "sums=$(sha256sum out/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: out/
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # Push, sign, publish. Only for a publishing run on a `v*` tag, only after every job above
  # passed, and only once a maintainer approved the `release` environment. Each job checks
  # the release state and the approval again: "Re-run failed jobs" skips the gate.
  # ---------------------------------------------------------------------------------------

  images-publish:
    name: Push and sign image (${{ matrix.component }})
    needs: [gate, binaries-x86_64, binaries-aarch64, binaries-x86_64-repro, binaries-aarch64-repro, sbom, sbom-repro, crates-package, npm-pack, npm-pack-repro, images, assemble]
    if: needs.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    strategy:
      fail-fast: false
      matrix:
        component: [relay, gateway]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the run's environment approvals (release-approval-check.sh)
      packages: write # unused once GHCR_PUSH_TOKEN is set (docs/release.md, owner step 4)
      id-token: write # Sigstore keyless signing
      attestations: write # SLSA build provenance
    env:
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
      COMPONENT: ${{ matrix.component }}
      # What the `images` job built twice: the index digest and one manifest per platform.
      WANT_INDEX: ${{ needs.images.outputs[matrix.component] }}
      WANT_AMD64: ${{ needs.images.outputs[format('{0}-amd64', matrix.component)] }}
      WANT_ARM64: ${{ needs.images.outputs[format('{0}-arm64', matrix.component)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Release state and approval
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          SIGNER: ${{ needs.gate.outputs.signer }}
        run: |
          ./scripts/release-state-check.sh "$TAG" "$COMMIT"
          ./scripts/release-approval-check.sh "$SIGNER"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: dl/binaries-x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: binaries-aarch64-unknown-linux-gnu
          path: dl/binaries-aarch64-unknown-linux-gnu
      - name: The binaries are the ones the binaries jobs uploaded
        env:
          SUMS_X86_64: ${{ needs.binaries-x86_64.outputs.sums }}
          SUMS_AARCH64: ${{ needs.binaries-aarch64.outputs.sums }}
        run: |
          set -euo pipefail
          EXPECTED=$SUMS_X86_64 ./scripts/release-artifact-sums.sh --check dl/binaries-x86_64-unknown-linux-gnu
          EXPECTED=$SUMS_AARCH64 ./scripts/release-artifact-sums.sh --check dl/binaries-aarch64-unknown-linux-gnu
      - name: Lay out the build context (as the `images` job did)
        run: |
          set -euo pipefail
          mkdir -p ctx/amd64 ctx/arm64
          cp "dl/binaries-x86_64-unknown-linux-gnu/xchonnect-$COMPONENT" ctx/amd64/
          cp "dl/binaries-aarch64-unknown-linux-gnu/xchonnect-$COMPONENT" ctx/arm64/
          chmod 0755 ctx/*/"xchonnect-$COMPONENT"
          find ctx -exec touch -d "@$SOURCE_DATE_EPOCH" {} +
      # Pinned as in the `images` job; this job holds the ghcr.io credentials.
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Lower-case the image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=$REGISTRY/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/xchonnect-$COMPONENT" >> "$GITHUB_OUTPUT"
      - name: Before pushing, the image is the one the `images` job built
        run: |
          set -euo pipefail
          docker buildx build \
            --file deploy/Dockerfile.dist \
            --target "$COMPONENT" \
            --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false \
            --metadata-file metadata-local.json \
            --output "type=oci,dest=image-local.tar,rewrite-timestamp=true" \
            ctx
          have=$(jq -r '."containerimage.digest"' metadata-local.json)
          if [ -z "$WANT_INDEX" ] || [ "$have" != "$WANT_INDEX" ]; then
            echo "::error::built $have, but the images job built ${WANT_INDEX:-nothing}; nothing was pushed"
            exit 1
          fi
          echo "image index $have, as the images job built it"
      # Option (a) of docs/release.md, owner step 4: a bot account's token, stored only as a
      # secret of the `release` environment, when the owner set one; GITHUB_TOKEN otherwise.
      - name: Which credentials push to ghcr.io
        env:
          HAS_PUSH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN != '' }}
        run: |
          if [ "$HAS_PUSH_TOKEN" = "true" ]; then
            echo "pushing with the release environment's GHCR_PUSH_TOKEN"
          else
            echo "pushing with GITHUB_TOKEN (no GHCR_PUSH_TOKEN in the release environment)"
          fi
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PUSH_TOKEN != '' && vars.GHCR_PUSH_USER || github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}
      - name: Push the multi-platform image
        id: push
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1; do not use $IMAGE:$VERSION, it is not signed"; exit 1; }
          # One manifest list over both platforms, built from the same contexts that the
          # `images` job proved reproducible.
          docker buildx build \
            --file deploy/Dockerfile.dist \
            --target "$COMPONENT" \
            --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false \
            --metadata-file metadata.json \
            --output "type=image,name=$IMAGE:$VERSION,push=true,rewrite-timestamp=true" \
            ctx
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          [ "$digest" = "$WANT_INDEX" ] || fail "pushed $digest, expected $WANT_INDEX"
          # What the registry serves under that digest, platform by platform.
          docker buildx imagetools inspect --raw "$IMAGE@$digest" > index.json
          [ "sha256:$(sha256sum index.json | cut -d' ' -f1)" = "$WANT_INDEX" ] ||
            fail "the registry serves another index under $digest"
          [ "$(jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest' index.json)" = "$WANT_AMD64" ] ||
            fail "the amd64 manifest differs from the images job's $WANT_AMD64"
          [ "$(jq -r '.manifests[] | select(.platform.architecture == "arm64") | .digest' index.json)" = "$WANT_ARM64" ] ||
            fail "the arm64 manifest differs from the images job's $WANT_ARM64"
          echo "pushed $IMAGE@$digest (amd64 $WANT_AMD64, arm64 $WANT_ARM64)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign the image (Sigstore keyless, no key material anywhere)
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "$REF"
      # GitHub stores attestations only for public repositories (and Enterprise Cloud); on a
      # private one the step fails after the image is already pushed and signed, so skip it.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        if: github.event.repository.visibility == 'public'
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  sign:
    name: Sign the assets and attach them to the release
    needs: [gate, binaries-x86_64, binaries-aarch64, binaries-x86_64-repro, binaries-aarch64-repro, sbom, sbom-repro, crates-package, npm-pack, npm-pack-repro, images, assemble]
    if: needs.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # assets onto the owner's GitHub release
      actions: read # the run's environment approvals (release-approval-check.sh)
      id-token: write # Sigstore keyless
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Release state and approval
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          SIGNER: ${{ needs.gate.outputs.signer }}
        run: |
          ./scripts/release-state-check.sh "$TAG" "$COMMIT"
          ./scripts/release-approval-check.sh "$SIGNER"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: out
      - name: The release directory is the one `assemble` made
        env:
          SUMS: ${{ needs.assemble.outputs.sums }}
        run: |
          set -euo pipefail
          echo "$SUMS  out/SHA256SUMS" | sha256sum -c -
          (cd out && sha256sum -c SHA256SUMS)
          # Nothing beside the files the manifest names.
          [ "$(cd out && find . -type f ! -name SHA256SUMS | sed 's|^\./||' | sort)" = "$(awk '{print $2}' out/SHA256SUMS | sort)" ]
      # Signing only when publishing: a signature carries the release identity
      # (release-publish.yml@refs/tags/...) and lands in the public Rekor log.
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign SHA256SUMS (Sigstore keyless OIDC)
        run: |
          cosign sign-blob --yes \
            --bundle out/SHA256SUMS.sigstore.json \
            out/SHA256SUMS
      # Same as for the images: attestations need a public repository.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            out/xchonnect-relay-*
            out/xchonnect-gateway-*
            out/*.cdx.json
      - name: Self-check the published verification procedure
        # The gate made sure a publishing run runs on the tag, so the signing identity is
        # the one third parties verify against. A private repository has no attestations
        # (above), so the provenance step is skipped there, by name.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          REPO: ${{ github.repository }}
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          provenance=()
          [ "$VISIBILITY" = "public" ] || provenance=(--no-provenance)
          ./scripts/release-verify.sh --dir out --tag "$TAG" --repo "$REPO" ${provenance[@]+"${provenance[@]}"}
      - name: Attach the assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          REPO: ${{ github.repository }}
        # The owner created the release, its title and its notes; this only adds files.
        # --clobber: a re-run replaces the assets of the failed attempt, signature included.
        run: gh release upload "$TAG" out/* --clobber --repo "$REPO"

  npm:
    name: Publish @xchonnect/dapp to npm
    # After the images and the signed assets: an npm version cannot be published twice, so
    # nothing irreversible happens before the rest of the release passed. Only the
    # crates.io job follows. This job builds and installs nothing: it publishes the
    # tarball `npm-pack` made, after checking its digest.
    needs: [gate, binaries-x86_64, binaries-aarch64, binaries-x86_64-repro, binaries-aarch64-repro, sbom, sbom-repro, crates-package, npm-pack, npm-pack-repro, images, assemble, images-publish, sign]
    if: needs.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the run's environment approvals (release-approval-check.sh)
      id-token: write # npm trusted publishing (OIDC) and provenance; no NPM_TOKEN exists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Release state and approval
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          SIGNER: ${{ needs.gate.outputs.signer }}
        run: |
          ./scripts/release-state-check.sh "$TAG" "$COMMIT"
          ./scripts/release-approval-check.sh "$SIGNER"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          v=$(npm --version)
          [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" = 11.5.1 ] ||
            { echo "npm $v cannot publish through OIDC; need 11.5.1 or later" >&2; exit 1; }
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm
      - name: Publish the tarball (provenance, dist-tag from the version; skipped if npm has it)
        # Outside the checkout: no package.json, .npmrc or workspace of the repository
        # takes part in the publish.
        working-directory: ${{ runner.temp }}/npm
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          FILE: ${{ needs.npm-pack.outputs.file }}
          SHA256: ${{ needs.npm-pack.outputs.sha256 }}
          SHA256_REPRO: ${{ needs.npm-pack-repro.outputs.sha256 }}
        run: |
          set -euo pipefail
          fail() { echo "::error::npm: $1"; exit 1; }
          # Two independent builds made the same tarball, and this is it.
          if [ -z "$SHA256" ] || [ "$SHA256" != "$SHA256_REPRO" ]; then
            fail "npm-pack built ${SHA256:-nothing}, npm-pack-repro ${SHA256_REPRO:-nothing}; the tarball does not reproduce"
          fi
          echo "$SHA256  $FILE" | sha256sum -c -
          [ "$(tar -xzOf "$FILE" package/package.json | jq -r '.name + "@" + .version')" = "@xchonnect/dapp@$VERSION" ] ||
            fail "$FILE is not @xchonnect/dapp@$VERSION"
          integrity="sha512-$(openssl dgst -sha512 -binary "$FILE" | base64 -w0)"
          # A re-run after npm accepted the version must not fail (crates.io would be
          # skipped), and must not hide a different tarball under the same version.
          code=$(curl -sS --retry 3 -o "$RUNNER_TEMP/npm-published.json" -w '%{http_code}' \
            "https://registry.npmjs.org/@xchonnect%2fdapp/$VERSION")
          case "$code" in
            200)
              have=$(jq -r '.dist.integrity // ""' "$RUNNER_TEMP/npm-published.json")
              [ "$have" = "$integrity" ] ||
                fail "@xchonnect/dapp@$VERSION is already on npm with integrity $have; this run built $integrity (docs/release.md, 'If something goes wrong')"
              echo "@xchonnect/dapp@$VERSION is already on npm with this tarball's integrity; nothing to publish"
              exit 0
              ;;
            404) ;;
            *) fail "registry.npmjs.org answered $code for @xchonnect/dapp@$VERSION" ;;
          esac
          # A pre-release (1.0.0-rc.1) must not become what `npm install @xchonnect/dapp` gets.
          dist_tag=latest
          case "$VERSION" in *-*) dist_tag=next ;; esac
          npm publish "./$FILE" --provenance --access public --tag "$dist_tag" --ignore-scripts

  crates:
    name: Publish xchonnect-core and xchonnect-wallet-kit to crates.io
    # Last of all. A crates.io version cannot be published twice either (a yank hides it,
    # the number stays taken), so this waits for the images, the signed assets and npm.
    # crates.io has no dist-tags and needs none: Cargo selects a pre-release only for a
    # requirement that names one, so `xchonnect-core = "0.1"` never resolves to an rc.
    # No build script runs here: `crates-package` built the crates, and the upload uses
    # --no-verify (cargo packages the sources and compiles nothing).
    needs: [gate, binaries-x86_64, binaries-aarch64, binaries-x86_64-repro, binaries-aarch64-repro, sbom, sbom-repro, crates-package, npm-pack, npm-pack-repro, images, assemble, images-publish, sign, npm]
    if: needs.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the run's environment approvals (release-approval-check.sh)
      id-token: write # crates.io trusted publishing (OIDC); no CARGO_REGISTRY_TOKEN secret exists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Release state and approval
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          SIGNER: ${{ needs.gate.outputs.signer }}
        run: |
          ./scripts/release-state-check.sh "$TAG" "$COMMIT"
          ./scripts/release-approval-check.sh "$SIGNER"
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # Asked before a token exists: a re-run after a partial publish, or after the first
      # version went up by hand (docs/release.md), has nothing left to authenticate for.
      - name: Versions that are not on crates.io yet
        id: pending
        run: |
          # Assigned first: a failed index lookup must fail the step, not publish nothing.
          crates=$(./scripts/release-crates.sh --pending)
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
      # Exchanges the job's GitHub OIDC token for a crates.io token that is valid for
      # minutes and only for crates naming release-publish.yml (environment `release`) as
      # their trusted publisher; the action revokes it when the job ends.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: steps.pending.outputs.crates != ''
      # release-crates.sh packages both crates again (deterministic, nothing compiled) and
      # uploads nothing unless the tarballs are the ones `crates-package` built and checked.
      - name: Publish (core before wallet-kit, without rebuilding)
        if: steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          XCHONNECT_CRATES_SHA256: ${{ needs.crates-package.outputs.sums }}
        run: |
          set -euo pipefail
          [ -n "$XCHONNECT_CRATES_SHA256" ] || { echo "::error::crates-package stated no digests"; exit 1; }
          ./scripts/release-crates.sh --publish
