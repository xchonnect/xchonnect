name: CI

on:
  pull_request:
  push:
    branches: [main, testing]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (lint, test, cross-targets)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: xchonnect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      XCHONNECT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/xchonnect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Relay conformance suite (reference relay, in-memory store)
        run: ./scripts/relay-conformance.sh
      - name: Relay conformance suite (reference relay, Postgres store)
        run: ./scripts/relay-conformance.sh "$XCHONNECT_TEST_DATABASE_URL"
      - name: Install wasm-bindgen test runner (version from Cargo.lock)
        run: |
          v=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version' | head -1)
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: Core tests on wasm32 (Node)
        run: cargo test -p xchonnect-core --target wasm32-unknown-unknown --lib --locked
      - name: Core builds for wasm32
        run: cargo build -p xchonnect-core -p xchonnect-wasm --target wasm32-unknown-unknown --locked
      - name: Core type-checks for Android
        run: cargo check -p xchonnect-core --target aarch64-linux-android --locked
      - name: Android libraries incl. wallet-kit (runner's preinstalled NDK)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cargo install cargo-ndk --locked
          ./scripts/build-kotlin.sh

  fuzz:
    name: Fuzz (30 s per target)
    runs-on: ubuntu-24.04
    env:
      # Nightly may add lints the pinned toolchain does not know; lints are enforced by
      # the rust job.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: relay_http seed corpus matches its generator
        run: ./scripts/fuzz-seeds-relay-http.py --check
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo +nightly fuzz build
      - name: Run each target for 30 s
        run: |
          for t in $(cargo +nightly fuzz list); do
            echo "::group::$t"
            mkdir -p "$RUNNER_TEMP/corpus/$t"
            cargo +nightly fuzz run "$t" "$RUNNER_TEMP/corpus/$t" "fuzz/corpus/$t" -- -max_total_time=30
            echo "::endgroup::"
          done

  ios:
    name: iOS build (XCFramework + Swift round trip)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: XCFramework (device + simulator) and Swift sources
        run: ./scripts/build-swift.sh
      - name: Generated Swift package compiles for iOS
        working-directory: target/swift
        run: |
          xcodebuild -scheme Xchonnect -destination 'generic/platform=iOS' -derivedDataPath ../swift-dd build
          xcodebuild -scheme Xchonnect -destination 'generic/platform=iOS Simulator' -derivedDataPath ../swift-dd build
      - name: Swift round trip against the core dApp side (macOS host)
        run: ./scripts/test-swift.sh

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-bindgen CLI (pinned in bindings/wasm/Cargo.toml)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build WASM core (enforces gzip size budget)
        run: ./scripts/build-wasm.sh
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Interop (SDK <-> relay <-> CLI wallet)
        run: |
          cargo build -p xchonnect-relay -p xchonnect-wallet-cli --locked
          npm run test:interop -w @xchonnect/dapp
