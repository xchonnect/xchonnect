name: CI

on:
  pull_request:
  push:
    branches: [main, testing]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (lint, test, cross-targets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Install wasm-bindgen test runner (version from Cargo.lock)
        run: |
          v=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version' | head -1)
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: Core tests on wasm32 (Node)
        run: cargo test -p xchonnect-core --target wasm32-unknown-unknown --lib --locked
      - name: Core builds for wasm32
        run: cargo build -p xchonnect-core -p xchonnect-wasm --target wasm32-unknown-unknown --locked
      - name: Core type-checks for Android
        run: cargo check -p xchonnect-core -p xchonnect-uniffi --target aarch64-linux-android --locked

  fuzz:
    name: Fuzz (30 s per target)
    runs-on: ubuntu-24.04
    env:
      # Nightly may add lints the pinned toolchain does not know; lints are enforced by
      # the rust job.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo +nightly fuzz build
      - name: Run each target for 30 s
        run: |
          for t in $(cargo +nightly fuzz list); do
            echo "::group::$t"
            mkdir -p "$RUNNER_TEMP/corpus/$t"
            cargo +nightly fuzz run "$t" "$RUNNER_TEMP/corpus/$t" "fuzz/corpus/$t" -- -max_total_time=30
            echo "::endgroup::"
          done

  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p xchonnect-core -p xchonnect-uniffi --target aarch64-apple-ios --locked
      - run: cargo build -p xchonnect-core -p xchonnect-uniffi --target aarch64-apple-ios-sim --locked

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
