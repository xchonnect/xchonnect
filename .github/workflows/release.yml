name: Release

# Two steps, two decisions (docs/release.md, "Cutting a release"):
#
# - Pushing a signed annotated tag (`git tag -s v1.0.0`) runs everything that publishes
#   nothing: the gate, the reproducible builds, the SBOMs, the crate packaging, the npm
#   tarball, the image builds and the release directory. Nothing is signed, pushed,
#   uploaded or published.
# - Publishing a GitHub release for that tag in the web UI runs the same jobs again and
#   then, once a maintainer approves the `release` environment, publishes: images to
#   ghcr.io, the signed assets onto that release, npm, crates.io.
#
# Every job that pushes, signs or publishes runs in the GitHub environment `release`,
# only on a `refs/tags/v*` ref, only after every build and package job passed, and checks
# the release state and the approval again itself. The registries trust only OIDC tokens
# of release.yml in that environment, and the environment admits only `v*` tags, which
# only maintainers may create; so a workflow changed on a branch cannot publish.
#
# Every job checks out the commit the gate resolved the tag to, by SHA: a tag moved during
# the run cannot change what is built. This is the only workflow: nothing runs on a push
# to a branch or on a pull request.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  release:
    # `published` also fires for a pre-release; a draft fires nothing.
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed tag to re-run the pipeline for"
        required: true
      publish:
        description: "Publish (images, release assets, npm, crates.io). Needs a published GitHub release for the tag and the run started on the tag itself (Use workflow from: the tag). Off = build and verify only"
        type: boolean
        default: false

permissions:
  contents: read

# One run per tag at a time: the verify run of the tag push finishes before the release
# run of the same tag starts.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Images are named after the repository owner, lower-cased by ghcr convention.
  REGISTRY: ghcr.io

jobs:
  gate:
    name: Gate (tag, versions, changelog, signer)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.id.outputs.tag }}
      version: ${{ steps.id.outputs.version }}
      epoch: ${{ steps.id.outputs.epoch }}
      publish: ${{ steps.id.outputs.publish }}
      commit: ${{ steps.id.outputs.commit }}
      signer: ${{ steps.id.outputs.signer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      - name: Toolchain (from rust-toolchain.toml; the gate reads the crate versions with cargo)
        run: rustup show active-toolchain || rustup toolchain install
      - id: id
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::release gate: $1"; exit 1; }
          # Versions, changelog, and a tag signed by a key of a login in
          # .github/release-maintainers.txt; it reports the tag's commit and the signer.
          gate_out="$RUNNER_TEMP/gate-out"
          : > "$gate_out"
          XCHONNECT_GATE_OUTPUT="$gate_out" ./scripts/release-gate.sh "$TAG"
          commit=$(sed -n 's/^commit=//p' "$gate_out")
          signer=$(sed -n 's/^signer=//p' "$gate_out")
          [ -n "$commit" ] && [ -n "$signer" ] || fail "the gate script reported no commit or signer"
          # Everything later checks out $commit by SHA. It must be what this job checked
          # and, on a run of the tag itself, the commit the event was for.
          [ "$(git rev-parse HEAD)" = "$commit" ] ||
            fail "checked out $(git rev-parse HEAD), but $TAG points at $commit on GitHub"
          if [ "$RUN_REF" = "refs/tags/$TAG" ] && [ "$RUN_SHA" != "$commit" ]; then
            fail "this run was started for $RUN_SHA, but $TAG now points at $commit; a release tag is never moved"
          fi
          # Only a published GitHub release publishes. A tag push verifies; a manual run
          # publishes only when asked to and only under the conditions below.
          case "$EVENT" in
            release) publish=true ;;
            workflow_dispatch) publish=$DISPATCH_PUBLISH ;;
            *) publish=false ;;
          esac
          if [ "$publish" = "true" ]; then
            # The signing identity is release.yml at the run's ref, and the `release`
            # environment admits only tags; anything but this tag cannot publish.
            [ "$RUN_REF" = "refs/tags/$TAG" ] ||
              fail "a publishing run must run on refs/tags/$TAG, not $RUN_REF (manual run: pick the tag under 'Use workflow from')"
            # Published, not a draft, pre-release flag matching the version, tag unmoved.
            # The publishing jobs repeat this: "Re-run failed jobs" does not re-run the gate.
            ./scripts/release-state-check.sh "$TAG" "$commit"
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            # One build timestamp for every artifact of this release: the commit time.
            echo "epoch=$(git -c log.showsignature=false log -1 --pretty=%ct)"
            echo "publish=$publish"
            echo "commit=$commit"
            echo "signer=$signer"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------
  # Build and package. No job here can push, sign or publish anything, and none gets an
  # OIDC token or write access.
  # ---------------------------------------------------------------------------------------

  binaries:
    name: Binaries (${{ matrix.target }}, built twice)
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      XCHONNECT_RELEASE_TARGET: ${{ matrix.target }}
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$XCHONNECT_RELEASE_TARGET"
      # No build cache: a release binary is compiled from source every time, so a
      # poisoned cache cannot reach a signed artifact.
      - name: Reproducibility gate (two cold builds must agree)
        run: ./scripts/release-repro-check.sh
      - name: Collect the artifacts
        run: |
          mkdir -p dist
          cp target/release-repro/a/xchonnect-relay dist/
          cp target/release-repro/a/xchonnect-gateway dist/
          cp target/release-repro/a/BUILD-INFO.txt dist/
          (cd dist && sha256sum xchonnect-relay xchonnect-gateway | tee SHA256SUMS)
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: binaries-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: CycloneDX SBOMs
    needs: [gate]
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-cyclonedx (pinned, must match scripts/sbom.sh)
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: rustup target add wasm32-unknown-unknown
      - run: ./scripts/sbom.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sbom
          path: target/sbom/
          if-no-files-found: error
          retention-days: 7

  crates-package:
    name: Crates (packaged and built from the tarballs)
    # Publishes nothing. Its build scripts run here, without any token; the `crates` job
    # uploads with --no-verify and builds nothing.
    needs: [gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # No build cache, as for the binaries.
      - name: cargo package --locked for xchonnect-core and xchonnect-wallet-kit
        run: ./scripts/release-crates.sh

  npm-pack:
    name: npm tarball for @xchonnect/dapp (built, not published)
    # Everything that runs code from dependencies (cargo build scripts, wasm-bindgen, tsc)
    # runs here, without an OIDC token. The `npm` job publishes exactly this tarball.
    needs: [gate]
    runs-on: ubuntu-24.04
    outputs:
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # No build cache, as for the binaries: the published WASM core is compiled from source.
      - name: Install wasm-bindgen CLI (pinned in bindings/wasm/Cargo.toml)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build WASM core (enforces gzip size budget)
        run: ./scripts/build-wasm.sh
      - run: npm ci --ignore-scripts
      - run: npm run build -w @xchonnect/dapp
      - name: npm pack
        id: pack
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/npm"
          mkdir -p "$out"
          # --ignore-scripts: prepack would rebuild what the steps above just built.
          npm pack -w @xchonnect/dapp --ignore-scripts --pack-destination "$out" --json > "$RUNNER_TEMP/pack.json"
          file=$(jq -r '.[0].filename' "$RUNNER_TEMP/pack.json")
          if [ "$file" != "xchonnect-dapp-$VERSION.tgz" ] || [ ! -f "$out/$file" ]; then
            echo "::error::npm pack made '$file', expected xchonnect-dapp-$VERSION.tgz"
            exit 1
          fi
          tar -tzf "$out/$file" | sort
          sha256=$(sha256sum "$out/$file" | cut -d' ' -f1)
          echo "$sha256  $file"
          { echo "file=$file"; echo "sha256=$sha256"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error
          retention-days: 7

  images:
    name: Images (${{ matrix.component }}, built twice)
    needs: [gate, binaries]
    strategy:
      fail-fast: false
      matrix:
        component: [relay, gateway]
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: binaries-*
          path: dl
      - name: Lay out the build context (one directory per architecture)
        run: |
          set -euo pipefail
          # The image contains exactly the binary the release signed; TARGETARCH in
          # Dockerfile.dist picks the right one per platform.
          mkdir -p ctx/amd64 ctx/arm64
          cp "dl/binaries-x86_64-unknown-linux-gnu/xchonnect-$COMPONENT" ctx/amd64/
          cp "dl/binaries-aarch64-unknown-linux-gnu/xchonnect-$COMPONENT" ctx/arm64/
          chmod 0755 ctx/*/"xchonnect-$COMPONENT"
          # Fixed mtimes, so layer tars do not carry the download time.
          find ctx -exec touch -d "@$SOURCE_DATE_EPOCH" {} +
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build twice locally and compare image digests
        run: |
          set -euo pipefail
          for pass in a b; do
            : > "digests-$pass"
            for plat in amd64 arm64; do
              docker buildx build \
                --file deploy/Dockerfile.dist \
                --target "$COMPONENT" \
                --platform "linux/$plat" \
                --provenance=false --sbom=false \
                --metadata-file "meta-$pass-$plat.json" \
                --output "type=oci,dest=image-$pass-$plat.tar,rewrite-timestamp=true" \
                ctx
              echo "$plat $(jq -r '."containerimage.digest"' "meta-$pass-$plat.json")" >> "digests-$pass"
            done
            cat "digests-$pass"
          done
          if ! diff -u digests-a digests-b; then
            echo "container image for $COMPONENT is not reproducible" >&2
            exit 1
          fi
          echo "image digests reproduce"

  assemble:
    name: Release directory (assets and SHA256SUMS, unsigned)
    needs: [gate, binaries, sbom]
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      sums: ${{ steps.assemble.outputs.sums }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: dl
      - name: Assemble the release directory
        id: assemble
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          for d in dl/binaries-*; do
            triple=${d#dl/binaries-}
            for b in xchonnect-relay xchonnect-gateway; do
              cp "$d/$b" "out/$b-$VERSION-$triple"
            done
            cp "$d/BUILD-INFO.txt" "out/BUILD-INFO-$triple.txt"
          done
          cp dl/sbom/*.cdx.json out/
          # One manifest over every asset: this file is what gets signed, so a
          # signature covers the whole release indivisibly.
          (cd out && sha256sum -- * | sort -k2 > SHA256SUMS)
          cat out/SHA256SUMS
          echo "sums=$(sha256sum out/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: out/
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # Push, sign, publish. Only for a publishing run on a `v*` tag, only after every job above
  # passed, and only once a maintainer approved the `release` environment. Each job checks
  # the release state and the approval again: "Re-run failed jobs" skips the gate.
  # ---------------------------------------------------------------------------------------

  images-publish:
    name: Push and sign image (${{ matrix.component }})
    needs: [gate, binaries, sbom, crates-package, npm-pack, images, assemble]
    if: needs.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    strategy:
      fail-fast: false
      matrix:
        component: [relay, gateway]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the run's environment approvals (release-approval-check.sh)
      packages: write
      id-token: write # Sigstore keyless signing
      attestations: write # SLSA build provenance
    env:
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Release state and approval
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          SIGNER: ${{ needs.gate.outputs.signer }}
        run: |
          ./scripts/release-state-check.sh "$TAG" "$COMMIT"
          ./scripts/release-approval-check.sh "$SIGNER"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: binaries-*
          path: dl
      - name: Lay out the build context (as the `images` job did)
        run: |
          set -euo pipefail
          mkdir -p ctx/amd64 ctx/arm64
          cp "dl/binaries-x86_64-unknown-linux-gnu/xchonnect-$COMPONENT" ctx/amd64/
          cp "dl/binaries-aarch64-unknown-linux-gnu/xchonnect-$COMPONENT" ctx/arm64/
          chmod 0755 ctx/*/"xchonnect-$COMPONENT"
          find ctx -exec touch -d "@$SOURCE_DATE_EPOCH" {} +
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Lower-case the image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=$REGISTRY/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/xchonnect-$COMPONENT" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the multi-platform image
        id: push
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          # One manifest list over both platforms, built from the same contexts that the
          # `images` job proved reproducible.
          docker buildx build \
            --file deploy/Dockerfile.dist \
            --target "$COMPONENT" \
            --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false \
            --metadata-file metadata.json \
            --output "type=image,name=$IMAGE:$VERSION,push=true,rewrite-timestamp=true" \
            ctx
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign the image (Sigstore keyless, no key material anywhere)
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "$REF"
      # GitHub stores attestations only for public repositories (and Enterprise Cloud); on a
      # private one the step fails after the image is already pushed and signed, so skip it.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        if: github.event.repository.visibility == 'public'
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  sign:
    name: Sign the assets and attach them to the release
    needs: [gate, binaries, sbom, crates-package, npm-pack, images, assemble]
    if: needs.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # assets onto the owner's GitHub release
      actions: read # the run's environment approvals (release-approval-check.sh)
      id-token: write # Sigstore keyless
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Release state and approval
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          SIGNER: ${{ needs.gate.outputs.signer }}
        run: |
          ./scripts/release-state-check.sh "$TAG" "$COMMIT"
          ./scripts/release-approval-check.sh "$SIGNER"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: out
      - name: The release directory is the one `assemble` made
        env:
          SUMS: ${{ needs.assemble.outputs.sums }}
        run: |
          set -euo pipefail
          echo "$SUMS  out/SHA256SUMS" | sha256sum -c -
          (cd out && sha256sum -c SHA256SUMS)
          # Nothing beside the files the manifest names.
          [ "$(cd out && find . -type f ! -name SHA256SUMS | sed 's|^\./||' | sort)" = "$(awk '{print $2}' out/SHA256SUMS | sort)" ]
      # Signing only when publishing: a signature carries the release identity
      # (release.yml@refs/tags/...) and lands in the public Rekor log.
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign SHA256SUMS (Sigstore keyless OIDC)
        run: |
          cosign sign-blob --yes \
            --bundle out/SHA256SUMS.sigstore.json \
            out/SHA256SUMS
      # Same as for the images: attestations need a public repository.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            out/xchonnect-relay-*
            out/xchonnect-gateway-*
            out/*.cdx.json
      - name: Self-check the published verification procedure
        # The gate made sure a publishing run runs on the tag, so the signing identity is
        # the one third parties verify against.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: ./scripts/release-verify.sh --dir out --tag "$TAG" --repo "$REPO"
      - name: Attach the assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          REPO: ${{ github.repository }}
        # The owner created the release, its title and its notes; this only adds files.
        # --clobber: a re-run replaces the assets of the failed attempt, signature included.
        run: gh release upload "$TAG" out/* --clobber --repo "$REPO"

  npm:
    name: Publish @xchonnect/dapp to npm
    # After the images and the signed assets: an npm version cannot be published twice, so
    # nothing irreversible happens before the rest of the release passed. Only the
    # crates.io job follows. This job builds and installs nothing: it publishes the
    # tarball `npm-pack` made, after checking its digest.
    needs: [gate, binaries, sbom, crates-package, npm-pack, images, assemble, images-publish, sign]
    if: needs.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the run's environment approvals (release-approval-check.sh)
      id-token: write # npm trusted publishing (OIDC) and provenance; no NPM_TOKEN exists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Release state and approval
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          SIGNER: ${{ needs.gate.outputs.signer }}
        run: |
          ./scripts/release-state-check.sh "$TAG" "$COMMIT"
          ./scripts/release-approval-check.sh "$SIGNER"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          v=$(npm --version)
          [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" = 11.5.1 ] ||
            { echo "npm $v cannot publish through OIDC; need 11.5.1 or later" >&2; exit 1; }
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm
      - name: Publish the tarball (provenance, dist-tag from the version; skipped if npm has it)
        # Outside the checkout: no package.json, .npmrc or workspace of the repository
        # takes part in the publish.
        working-directory: ${{ runner.temp }}/npm
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          FILE: ${{ needs.npm-pack.outputs.file }}
          SHA256: ${{ needs.npm-pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          fail() { echo "::error::npm: $1"; exit 1; }
          echo "$SHA256  $FILE" | sha256sum -c -
          [ "$(tar -xzOf "$FILE" package/package.json | jq -r '.name + "@" + .version')" = "@xchonnect/dapp@$VERSION" ] ||
            fail "$FILE is not @xchonnect/dapp@$VERSION"
          integrity="sha512-$(openssl dgst -sha512 -binary "$FILE" | base64 -w0)"
          # A re-run after npm accepted the version must not fail (crates.io would be
          # skipped), and must not hide a different tarball under the same version.
          code=$(curl -sS --retry 3 -o "$RUNNER_TEMP/npm-published.json" -w '%{http_code}' \
            "https://registry.npmjs.org/@xchonnect%2fdapp/$VERSION")
          case "$code" in
            200)
              have=$(jq -r '.dist.integrity // ""' "$RUNNER_TEMP/npm-published.json")
              [ "$have" = "$integrity" ] ||
                fail "@xchonnect/dapp@$VERSION is already on npm with integrity $have; this run built $integrity (docs/release.md, 'If something goes wrong')"
              echo "@xchonnect/dapp@$VERSION is already on npm with this tarball's integrity; nothing to publish"
              exit 0
              ;;
            404) ;;
            *) fail "registry.npmjs.org answered $code for @xchonnect/dapp@$VERSION" ;;
          esac
          # A pre-release (1.0.0-rc.1) must not become what `npm install @xchonnect/dapp` gets.
          dist_tag=latest
          case "$VERSION" in *-*) dist_tag=next ;; esac
          npm publish "./$FILE" --provenance --access public --tag "$dist_tag" --ignore-scripts

  crates:
    name: Publish xchonnect-core and xchonnect-wallet-kit to crates.io
    # Last of all. A crates.io version cannot be published twice either (a yank hides it,
    # the number stays taken), so this waits for the images, the signed assets and npm.
    # crates.io has no dist-tags and needs none: Cargo selects a pre-release only for a
    # requirement that names one, so `xchonnect-core = "0.1"` never resolves to an rc.
    # No build script runs here: `crates-package` built the crates, and the upload uses
    # --no-verify (cargo packages the sources and compiles nothing).
    needs: [gate, binaries, sbom, crates-package, npm-pack, images, assemble, images-publish, sign, npm]
    if: needs.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the run's environment approvals (release-approval-check.sh)
      id-token: write # crates.io trusted publishing (OIDC); no CARGO_REGISTRY_TOKEN secret exists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - name: The checkout is the commit the gate checked
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Release state and approval
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          SIGNER: ${{ needs.gate.outputs.signer }}
        run: |
          ./scripts/release-state-check.sh "$TAG" "$COMMIT"
          ./scripts/release-approval-check.sh "$SIGNER"
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # Asked before a token exists: a re-run after a partial publish, or after the first
      # version went up by hand (docs/release.md), has nothing left to authenticate for.
      - name: Versions that are not on crates.io yet
        id: pending
        run: |
          # Assigned first: a failed index lookup must fail the step, not publish nothing.
          crates=$(./scripts/release-crates.sh --pending)
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
      # Exchanges the job's GitHub OIDC token for a crates.io token that is valid for
      # minutes and only for crates naming release.yml (environment `release`) as their
      # trusted publisher; the action revokes it when the job ends.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: steps.pending.outputs.crates != ''
      - name: Publish (core before wallet-kit, without rebuilding)
        if: steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: ./scripts/release-crates.sh --publish
