chia-puzzle-types = "0.36"
clvmr = "0.16"
clvm-traits = "0.36"
clvm-utils = "0.36"
chia-sdk-driver = "0.36"
chia-sdk-types = "0.36"
chia-sdk-signer = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
chia-sdk-test = "0.36"

[lints]
workspace = true
