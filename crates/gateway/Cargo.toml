[package]
name = "xchonnect-gateway"
description = "Xchonnect reference push gateway: opens sealed tokens and delivers content-free wake-ups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
keywords = ["chia", "wallet", "push", "apns", "fcm"]
categories = ["web-programming::http-server", "cryptography"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "xchonnect-gateway"
path = "src/main.rs"

[dependencies]
xchonnect-core.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
xchonnect-relay.workspace = true
ureq = { version = "3", default-features = false }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
