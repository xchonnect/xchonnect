[package]
name = "xchonnect-relay"
description = "Xchonnect reference relay: anonymous mailboxes for end-to-end encrypted dApp/wallet messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "xchonnect-relay"
path = "src/main.rs"

[features]
default = ["postgres"]
postgres = ["dep:sqlx"]

[dependencies]
xchonnect-core.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
sqlx = { version = "0.9", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }

[dev-dependencies]
http-body-util = "0.1"

[lints]
workspace = true
