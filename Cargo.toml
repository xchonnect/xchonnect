[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/relay",
    "crates/gateway",
    "crates/wallet-kit",
    "bindings/wasm",
    "bindings/uniffi",
    "conformance",
    "examples/wallet-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/maximedogawa/xchonnect"
authors = ["Beidwerk and the Xchonnect contributors"]

[workspace.dependencies]
xchonnect-core = { path = "crates/core", version = "0.1.0" }
xchonnect-relay = { path = "crates/relay", version = "0.1.0" }

# Cryptography (see docs/design/crate-selection.md)
x25519-dalek = { version = "3.0", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "zeroize"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"
subtle = "2.6"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
